<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puente Charanal · Dashboard</title>
<style>
:root{
  --bg:#070d1a; --panel:#0d1526; --card:#101a2e; --line:#1c2a47; --line2:#263657;
  --tx:#e6ecf8; --tx2:#b5c2dd; --mut:#8393b2;
  --blue:#3b82f6; --blue-tx:#4f95ff; --green:#10b981; --amber:#f59e0b; --red:#f43f5e;
  --input:#0a1220; --mono:'Consolas','JetBrains Mono',monospace;
}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 'Segoe UI',system-ui,sans-serif;padding:28px;}
.mono{font-family:var(--mono);}
h1{font-size:20px;margin:0 0 3px;} .sub{color:var(--mut);font-size:13px;margin:0 0 4px;}
.api{font-size:11px;color:var(--mut);margin-bottom:20px;}
.api b{color:var(--green);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.card .label{font-size:12px;color:var(--mut);} .card .value{font-size:24px;font-weight:700;margin-top:8px;}
.card .sub2{font-size:11.5px;color:var(--mut);margin-top:6px;}
.bar{height:6px;background:#1f2d4d;border-radius:3px;margin-top:9px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--amber);}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
th{text-align:left;font-size:11px;color:var(--mut);text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);}
td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--tx2);}
tr:last-child td{border-bottom:0;}
.mini-bar{width:110px;height:6px;background:#1f2d4d;border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
.mini-bar i{display:block;height:100%;}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;}
.err{color:var(--red);background:#2a1119;border:1px solid #a1324a;padding:12px 16px;border-radius:10px;margin-bottom:16px;}
.src-btn{background:var(--input);border:1px solid var(--line2);color:var(--tx2);padding:3px 10px;border-radius:6px;font-size:11px;cursor:pointer;margin-right:4px;}
.src-btn.on{background:#1d3a73;color:#fff;border-color:#2d55a3;}
</style>
</head>
<body>
  <h1 id="pName">Cargando…</h1>
  <p class="sub" id="pSub"></p>
  <p class="api">Fuente de datos:
    <button class="src-btn" data-src="local">PC local (sin internet)</button>
    <button class="src-btn" data-src="cloud">Supabase (en la nube)</button>
    — <span id="apiUrl" class="mono"></span>
  </p>
  <div id="errBox"></div>

  <div class="kpis">
    <div class="card"><div class="label">Presupuesto total</div><div class="value mono" id="kPresu">—</div></div>
    <div class="card"><div class="label">Valorizado (avance real)</div><div class="value mono blue" id="kValor" style="color:var(--blue-tx)">—</div><div class="sub2" id="kValorS"></div></div>
    <div class="card"><div class="label">Avance físico</div><div class="value" id="kPct" style="color:var(--amber)">—</div><div class="bar"><i id="kBar"></i></div></div>
    <div class="card"><div class="label">Partidas</div><div class="value" id="kPartidas">—</div><div class="sub2" id="kPartidasS"></div></div>
  </div>

  <table>
    <thead><tr><th>Código</th><th>Partida</th><th>Unidad</th><th>Metrado</th><th>Avance</th><th>Presupuesto</th><th>Valor ganado</th></tr></thead>
    <tbody id="tbody"><tr><td colspan="7" class="mono" style="color:var(--mut)">Consultando la API…</td></tr></tbody>
  </table>

<script>
// Dos fuentes posibles, misma API REST (PostgREST): tu PC sin internet, o Supabase en la nube.
const FUENTES = {
  local: { url: 'http://localhost:3000', headers: {} },
  cloud: {
    url: 'https://vtynfshkgkrempibnqjd.supabase.co/rest/v1',
    headers: { apikey: 'sb_publishable_-g9cSWKmQc-EatM0IuSANQ_VHfZJmng', Authorization: 'Bearer sb_publishable_-g9cSWKmQc-EatM0IuSANQ_VHfZJmng' },
  },
};
// si esta página está publicada en internet (no en tu PC), no tiene sentido que intente
// hablar con tu localhost: parte en "nube" por defecto ahí, y en "local" en tu PC.
const esLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
let fuente = localStorage.getItem('obra-fuente') || (esLocal ? 'local' : 'cloud');

const fmt = (n, d=0) => 'S/. ' + Number(n).toLocaleString('es-PE', {minimumFractionDigits:d, maximumFractionDigits:d});
const colorOf = (pct) => pct >= 1 ? 'var(--green)' : pct > 0 ? 'var(--blue)' : 'var(--mut)';
const labelOf = (pct) => pct >= 1 ? 'Terminado' : pct > 0 ? 'En proceso' : 'Pendiente';
const bgOf = (pct) => pct >= 1 ? '#10b98126' : pct > 0 ? '#3b82f626' : '#8393b226';

document.querySelectorAll('.src-btn').forEach(b => {
  b.classList.toggle('on', b.dataset.src === fuente);
  b.addEventListener('click', () => { localStorage.setItem('obra-fuente', b.dataset.src); location.reload(); });
});

async function boot() {
  const { url: API, headers } = FUENTES[fuente];
  document.getElementById('apiUrl').textContent = API;
  try {
    const get = (path) => fetch(`${API}${path}`, { headers }).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status} en ${path}`); return r.json(); });
    const [proy] = await get('/proyectos?select=nombre,km,modalidad&limit=1');
    document.getElementById('pName').textContent = proy.nombre + ' — Dashboard (datos reales)';
    document.getElementById('pSub').textContent = `${proy.km || ''} · ${proy.modalidad || ''}`;

    const partidas = await get('/partidas?select=id,codigo,nombre,unidad,metrado,presupuesto');
    const avance = await get('/v_avance_partida?select=partida_id,pct_avance,valor_ganado');
    const avanceMap = Object.fromEntries(avance.map(a => [a.partida_id, a]));

    const presupuestoTotal = partidas.reduce((s, p) => s + Number(p.presupuesto), 0);
    const valorGanado = avance.reduce((s, a) => s + Number(a.valor_ganado), 0);
    const pctFisico = presupuestoTotal ? valorGanado / presupuestoTotal : 0;
    const terminadas = avance.filter(a => a.pct_avance >= 1).length;

    document.getElementById('kPresu').textContent = fmt(presupuestoTotal);
    document.getElementById('kValor').textContent = fmt(valorGanado);
    document.getElementById('kValorS').textContent = `${(pctFisico*100).toFixed(1)}% del total`;
    document.getElementById('kPct').textContent = (pctFisico*100).toFixed(1) + '%';
    document.getElementById('kBar').style.width = (pctFisico*100) + '%';
    document.getElementById('kPartidas').textContent = partidas.length;
    document.getElementById('kPartidasS').textContent = `${terminadas} terminadas`;

    document.getElementById('tbody').innerHTML = partidas.map(p => {
      const a = avanceMap[p.id] || { pct_avance: 0, valor_ganado: 0 };
      const pct = Number(a.pct_avance);
      return `<tr>
        <td class="mono">${p.codigo}</td><td>${p.nombre}</td><td>${p.unidad}</td>
        <td class="mono">${Number(p.metrado).toLocaleString('es-PE')}</td>
        <td><span class="mini-bar"><i style="width:${pct*100}%;background:${colorOf(pct)}"></i></span>
            <span class="badge" style="background:${bgOf(pct)};color:${colorOf(pct)}">${labelOf(pct)} ${(pct*100).toFixed(0)}%</span></td>
        <td class="mono">${fmt(p.presupuesto)}</td>
        <td class="mono" style="color:var(--blue-tx)">${fmt(a.valor_ganado)}</td>
      </tr>`;
    }).join('');
  } catch (err) {
    document.getElementById('errBox').innerHTML =
      `<div class="err"><b>No se pudo conectar con la API.</b> ¿Está corriendo <code>iniciar_api.bat</code>? (${err.message})</div>`;
    document.getElementById('pName').textContent = 'Puente Charanal — sin conexión a la API';
  }
}
boot();
</script>
</body>
</html>
