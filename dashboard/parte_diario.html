<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puente Charanal · Parte diario</title>
<style>
:root{
  --bg:#070d1a; --panel:#0d1526; --card:#101a2e; --line:#1c2a47; --line2:#263657;
  --tx:#e6ecf8; --tx2:#b5c2dd; --mut:#8393b2;
  --blue:#3b82f6; --blue-tx:#4f95ff; --green:#10b981; --amber:#f59e0b; --red:#f43f5e;
  --input:#0a1220; --mono:'Consolas','JetBrains Mono',monospace;
}
html{-webkit-text-size-adjust:100%;}
*{box-sizing:border-box;} body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 'Segoe UI',system-ui,sans-serif;padding:28px;overflow-x:hidden;}
.mono{font-family:var(--mono);}
h1{font-size:20px;margin:0 0 3px;} .sub{color:var(--mut);font-size:13px;margin:0 0 16px;}
.api{font-size:11px;color:var(--mut);margin-bottom:20px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;}
.src-btn{background:var(--input);border:1px solid var(--line2);color:var(--tx2);padding:6px 12px;border-radius:6px;font-size:11px;cursor:pointer;}
.src-btn.on{background:#1d3a73;color:#fff;border-color:#2d55a3;}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:640px;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
label{font-size:12.5px;color:var(--mut);font-weight:600;}
input,select,textarea{background:var(--input);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--tx);font:inherit;font-size:14px;width:100%;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;}
textarea{resize:vertical;min-height:70px;font-family:inherit;}
.hint{font-size:11.5px;color:var(--mut);}
.field-err{font-size:12px;color:var(--red);display:none;}
.field.invalid input,.field.invalid select{border-color:var(--red);}
.field.invalid .field-err{display:block;}
.btn{background:var(--blue);color:#fff;border:0;padding:12px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
.btn:disabled{opacity:.55;cursor:default;}
.msg{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:13.5px;max-width:640px;}
.msg.ok{background:#0f2e22;border:1px solid #1d6b47;color:#6ee7b7;}
.msg.err{background:#2a1119;border:1px solid #a1324a;color:#fca5b5;}
@media (max-width: 560px) {
  body{padding:16px 14px;}
  .row2{grid-template-columns:1fr;}
  .card{padding:14px;}
}
</style>
</head>
<body>
  <h1>Nuevo parte diario</h1>
  <p class="sub">Puente Charanal · registra el avance ejecutado en obra</p>
  <div class="api">
    Fuente: <button class="src-btn" data-src="local">PC local</button><button class="src-btn" data-src="cloud">Supabase (nube)</button>
  </div>

  <div id="msgBox"></div>

  <form class="card" id="form">
    <div class="row2">
      <div class="field" id="f-partida">
        <label for="partida">Partida</label>
        <select id="partida" required><option value="">Cargando partidas…</option></select>
        <span class="field-err">Elige una partida</span>
      </div>
      <div class="field" id="f-fecha">
        <label for="fecha">Fecha</label>
        <input id="fecha" type="date">
        <span class="field-err">Ingresa la fecha</span>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="turno">Turno</label>
        <select id="turno"><option value="dia">Día</option><option value="noche">Noche</option></select>
      </div>
      <div class="field">
        <label for="clima">Clima</label>
        <select id="clima"><option value="soleado">Soleado</option><option value="nublado">Nublado</option><option value="lluvia">Lluvia</option></select>
      </div>
    </div>
    <div class="row2">
      <div class="field" id="f-cantidad">
        <label for="cantidad">Cantidad ejecutada <span class="hint mono" id="unidadLbl"></span></label>
        <input id="cantidad" type="number" step="0.001" min="0" placeholder="0.00">
        <span class="field-err">Ingresa una cantidad mayor a 0</span>
      </div>
      <div class="field">
        <label for="ubicacion">Ubicación / frente</label>
        <input id="ubicacion" type="text" placeholder="Margen Derecha">
      </div>
    </div>
    <div class="field">
      <label for="obs">Observaciones</label>
      <textarea id="obs" placeholder="Sin incidencias."></textarea>
    </div>
    <button class="btn" id="btnGuardar" type="submit">Guardar parte diario</button>
  </form>

<script>
const FUENTES = {
  local: { url: 'http://localhost:3000', headers: {} },
  cloud: {
    url: 'https://vtynfshkgkrempibnqjd.supabase.co/rest/v1',
    headers: { apikey: 'sb_publishable_-g9cSWKmQc-EatM0IuSANQ_VHfZJmng', Authorization: 'Bearer sb_publishable_-g9cSWKmQc-EatM0IuSANQ_VHfZJmng' },
  },
};
const esLocal = ['localhost', '127.0.0.1'].includes(location.hostname);
let fuente = localStorage.getItem('obra-fuente') || (esLocal ? 'local' : 'cloud');
document.querySelectorAll('.src-btn').forEach(b => {
  b.classList.toggle('on', b.dataset.src === fuente);
  b.addEventListener('click', () => { localStorage.setItem('obra-fuente', b.dataset.src); location.reload(); });
});
const { url: API, headers } = FUENTES[fuente];

const $ = (s) => document.querySelector(s);
$('#fecha').value = new Date().toISOString().slice(0, 10);

let partidas = [], proyectoId = null;

function msg(text, ok) {
  $('#msgBox').innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${text}</div>`;
}

async function cargarPartidas() {
  const r = await fetch(`${API}/partidas?select=id,codigo,nombre,unidad,ubicacion,proyecto_id&order=codigo`, { headers });
  if (!r.ok) throw new Error(`No se pudo leer las partidas (HTTP ${r.status})`);
  partidas = await r.json();
  if (!partidas.length) { $('#partida').innerHTML = '<option value="">No hay partidas cargadas</option>'; return; }
  proyectoId = partidas[0].proyecto_id;
  $('#partida').innerHTML = '<option value="">Seleccione…</option>' +
    partidas.map(p => `<option value="${p.id}">${p.codigo} — ${p.nombre}</option>`).join('');
}
$('#partida').addEventListener('change', () => {
  const p = partidas.find(x => x.id === $('#partida').value);
  $('#unidadLbl').textContent = p ? `(${p.unidad})` : '';
  if (p && !$('#ubicacion').value) $('#ubicacion').value = p.ubicacion || '';
});

function marcarError(id, on) { $('#' + id).classList.toggle('invalid', on); }

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('#msgBox').innerHTML = '';
  let ok = true;
  const partidaId = $('#partida').value;
  const fecha = $('#fecha').value;
  const cantidad = parseFloat($('#cantidad').value);
  marcarError('f-partida', !partidaId); if (!partidaId) ok = false;
  marcarError('f-fecha', !fecha); if (!fecha) ok = false;
  marcarError('f-cantidad', !(cantidad > 0)); if (!(cantidad > 0)) ok = false;
  if (!ok) return;

  const btn = $('#btnGuardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    const body = {
      proyecto_id: proyectoId,
      partida_id: partidaId,
      fecha,
      turno: $('#turno').value,
      clima: $('#clima').value,
      cantidad_ejecutada: cantidad,
      ubicacion: $('#ubicacion').value || null,
      observaciones: $('#obs').value || null,
      estado: 'aprobado', // nota: sin una pantalla de aprobación todavía, se registra directo
    };
    const r = await fetch(`${API}/partes_diarios`, {
      method: 'POST',
      headers: { ...headers, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const detalle = await r.json().catch(() => ({}));
      if (r.status === 409) throw new Error('Ya existe un parte para esta partida, fecha y turno.');
      throw new Error(detalle.message || `HTTP ${r.status}`);
    }
    const [guardado] = await r.json();
    const p = partidas.find(x => x.id === partidaId);
    msg(`Guardado: ${p.codigo} · ${cantidad} ${p.unidad} el ${fecha}. Ya se refleja en el avance.`, true);
    $('#cantidad').value = ''; $('#obs').value = '';
  } catch (err) {
    msg(`No se pudo guardar: ${err.message}`, false);
  } finally {
    btn.disabled = false; btn.textContent = 'Guardar parte diario';
  }
});

cargarPartidas().catch((err) => msg(`No se pudo conectar con la API (${err.message}). ¿Está corriendo iniciar_api.bat?`, false));
</script>
</body>
</html>
